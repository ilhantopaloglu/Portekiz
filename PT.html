<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portekizce Çalışması</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 25px 18px 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 5px 0;
            font-size: 30px;
        }

        .header p {
            color: #666;
            margin-top: 8px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .mode-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-button {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .mode-button.active {
            border-color: #1683c5;
            background: #eaf6fc;
            color: #126b9f;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        textarea,
        select {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 13px;
            font-size: 16px;
            font-family: inherit;
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row > div {
            flex: 1;
        }

        .main-button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: #1683c5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-button:hover {
            opacity: 0.9;
        }

        .main-button:disabled {
            background: #aaa;
            cursor: wait;
        }

        .result {
            display: none;
        }

        .result-box {
            margin-bottom: 18px;
        }

        .result-title {
            font-size: 14px;
            font-weight: bold;
            color: #777;
            margin-bottom: 7px;
        }

        .sentence {
            font-size: 22px;
            line-height: 1.5;
        }

        .pronunciation {
            font-size: 19px;
            line-height: 1.5;
            color: #555;
        }

        .portuguese-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-button {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: #1683c5;
            color: white;
            font-size: 23px;
            cursor: pointer;
        }

        .play-button:hover {
            transform: scale(1.04);
        }

        .new-button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: 1px solid #1683c5;
            border-radius: 10px;
            background: white;
            color: #1683c5;
            font-size: 16px;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            display: none;
            background: #fff0f0;
            color: #b00020;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }

            .mode-buttons {
                flex-direction: column;
            }

            .header h1 {
                font-size: 25px;
            }

            .sentence {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🇵🇹 Portekizce Çalışması</h1>
        <p>Günlük hayatta kullanabileceğiniz Portekiz Portekizcesini öğrenin.</p>
    </div>

    <div class="card">

        <!-- Çalışma modu -->
        <div class="mode-buttons">

            <button
                id="manualModeButton"
                class="mode-button active"
                onclick="setMode('manual')">
                ✍️ Ben Cümle Yazacağım
            </button>

            <button
                id="aiModeButton"
                class="mode-button"
                onclick="setMode('ai')">
                🤖 YZ Cümle Üretsin
            </button>

        </div>


        <!-- BEN CÜMLE YAZACAĞIM -->
        <div id="manualArea">

            <label for="turkishSentence">
                Türkçe cümleniz
            </label>

            <textarea
                id="turkishSentence"
                placeholder="Örneğin: Yarın çocukları okula ben bırakacağım."></textarea>

            <button
                id="translateButton"
                class="main-button"
                onclick="translateSentence()">
                🇵🇹 Portekizceye Çevir
            </button>

        </div>


        <!-- YZ CÜMLE ÜRETSİN -->
        <div id="aiArea" style="display:none;">

            <div class="row">

                <div>
                    <label for="level">Seviye</label>

                    <select id="level">
                        <option value="Başlangıç">Başlangıç</option>
                        <option value="Orta">Orta</option>
                        <option value="İleri">İleri</option>
                    </select>
                </div>

                <div>
                    <label for="topic">Konu</label>

                    <select id="topic">
                        <option value="Günlük konuşma">Günlük konuşma</option>
                        <option value="Ev">Ev</option>
                        <option value="Market ve alışveriş">Market ve alışveriş</option>
                        <option value="Restoran">Restoran</option>
                        <option value="Okul">Okul</option>
                        <option value="Ulaşım">Ulaşım</option>
                        <option value="Seyahat">Seyahat</option>
                        <option value="Banka">Banka</option>
                        <option value="Sağlık">Sağlık</option>
                        <option value="İş">İş</option>
                        <option value="Komşular">Komşular</option>
                        <option value="Şehir hayatı">Şehir hayatı</option>
                    </select>
                </div>

            </div>

            <button
                id="generateButton"
                class="main-button"
                onclick="generateSentence()">
                🤖 Günlük Cümle Üret
            </button>

        </div>

        <div id="loading" class="loading">
            ⏳ Cümle hazırlanıyor...
        </div>

        <div id="error" class="error"></div>

    </div>


    <!-- SONUÇ -->
    <div id="result" class="card result">

        <div class="result-box">

            <div class="result-title">
                🇹🇷 TÜRKÇE
            </div>

            <div
                id="turkishResult"
                class="sentence">
            </div>

        </div>


        <div class="result-box">

            <div class="result-title">
                🇵🇹 PORTUGUÊS — PORTUGAL
            </div>

            <div class="portuguese-area">

                <div
                    id="portugueseResult"
                    class="sentence"
                    style="flex:1;">
                </div>

                <button
                    class="play-button"
                    onclick="speakPortuguese()"
                    title="Dinle">
                    ▶
                </button>

            </div>

        </div>


        <div class="result-box">

            <div class="result-title">
                🇹🇷 TÜRKÇE OKUNUŞ
            </div>

            <div
                id="pronunciationResult"
                class="pronunciation">
            </div>

        </div>


        <button
            id="newSentenceButton"
            class="new-button"
            onclick="newSentence()">
            🔄 Yeni Cümle
        </button>

    </div>


    <a href="index.html" class="back">
        ← Ana Sayfaya Dön
    </a>

</div>


<script>

    /*
     * ==========================================================
     * OPENAI API AYARI
     * ==========================================================
     *
     * Buraya kendi API anahtarınızı yazabilirsiniz.
     *
     * Ancak gerçek kullanımda API anahtarını HTML içine koymak
     * güvenli değildir.
     *
     * Uzun vadede bu çağrıyı bir backend üzerinden yapmak gerekir.
     */

    const OPENAI_API_KEY = "BURAYA_OPENAI_API_KEY";


    let currentPortugueseSentence = "";
    let currentMode = "manual";


    // ----------------------------------------------------------
    // MOD DEĞİŞTİR
    // ----------------------------------------------------------

    function setMode(mode) {

        currentMode = mode;

        const manualArea = document.getElementById("manualArea");
        const aiArea = document.getElementById("aiArea");

        const manualButton =
            document.getElementById("manualModeButton");

        const aiButton =
            document.getElementById("aiModeButton");


        if (mode === "manual") {

            manualArea.style.display = "block";
            aiArea.style.display = "none";

            manualButton.classList.add("active");
            aiButton.classList.remove("active");

        } else {

            manualArea.style.display = "none";
            aiArea.style.display = "block";

            manualButton.classList.remove("active");
            aiButton.classList.add("active");

        }

        hideError();
    }


    // ----------------------------------------------------------
    // TÜRKÇE CÜMLEYİ ÇEVİR
    // ----------------------------------------------------------

    async function translateSentence() {

        const sentence =
            document.getElementById("turkishSentence").value.trim();


        if (!sentence) {

            showError("Lütfen önce bir Türkçe cümle yazın.");
            return;
        }


        const prompt = `
Sen Avrupa Portekizcesi (Português Europeu / PT-PT) konusunda
uzman bir dil öğretmenisin.

Aşağıdaki Türkçe cümleyi Portekiz Portekizcesine çevir.

Brezilya Portekizcesi KULLANMA.

Ayrıca Türkçe konuşan bir öğrencinin Portekizce cümleyi
nasıl okuyabileceğini gösteren doğal ve anlaşılır bir
Türkçe fonetik okunuş yaz.

Türkçe okunuşta Portekiz Portekizcesinin gerçek telaffuzuna
mümkün olduğunca yaklaş.

Sadece aşağıdaki JSON formatında cevap ver:

{
  "turkish": "...",
  "portuguese": "...",
  "pronunciation": "..."
}

Türkçe cümle:
${sentence}
`;

        await askAI(prompt);
    }


    // ----------------------------------------------------------
    // YZ CÜMLE ÜRETSİN
    // ----------------------------------------------------------

    async function generateSentence() {

        const level =
            document.getElementById("level").value;

        const topic =
            document.getElementById("topic").value;


        const prompt = `
Sen Avrupa Portekizcesi (Português Europeu / PT-PT)
öğreten bir dil öğretmenisin.

Türkçe konuşan bir öğrenci için günlük hayatta gerçekten
kullanılabilecek BİR Türkçe cümle oluştur.

Seviye: ${level}
Konu: ${topic}

Cümle doğal, konuşma dilinde ve gerçek hayatta kullanılabilir
olsun.

Ardından cümleyi Avrupa Portekizcesine (PT-PT) çevir.

Brezilya Portekizcesi kullanma.

Son olarak Portekiz Portekizcesindeki telaffuza mümkün olduğunca
yakın bir Türkçe fonetik okunuş oluştur.

Sadece aşağıdaki JSON formatında cevap ver:

{
  "turkish": "...",
  "portuguese": "...",
  "pronunciation": "..."
}
`;

        await askAI(prompt);
    }


    // ----------------------------------------------------------
    // OPENAI ÇAĞRISI
    // ----------------------------------------------------------

    async function askAI(prompt) {

        showLoading(true);
        hideError();

        const button1 =
            document.getElementById("translateButton");

        const button2 =
            document.getElementById("generateButton");

        button1.disabled = true;
        button2.disabled = true;


        try {

            if (
                !OPENAI_API_KEY ||
                OPENAI_API_KEY === "BURAYA_OPENAI_API_KEY"
            ) {
                throw new Error(
                    "OpenAI API anahtarı tanımlanmamış."
                );
            }


            const response = await fetch(
                "https://api.openai.com/v1/chat/completions",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization":
                            "Bearer " + OPENAI_API_KEY
                    },

                    body: JSON.stringify({

                        model: "gpt-4o-mini",

                        messages: [

                            {
                                role: "system",
                                content:
                                    "You are an expert European Portuguese teacher."
                            },

                            {
                                role: "user",
                                content: prompt
                            }

                        ],

                        temperature: 0.7,

                        response_format: {
                            type: "json_object"
                        }

                    })
                }
            );


            if (!response.ok) {

                const errorData =
                    await response.json();

                throw new Error(
                    errorData?.error?.message ||
                    "OpenAI API hatası."
                );
            }


            const data =
                await response.json();


            const content =
                data.choices[0].message.content;


            const result =
                JSON.parse(content);


            showResult(result);

        }

        catch (error) {

            console.error(error);

            showError(
                "Bir hata oluştu: " +
                error.message
            );

        }

        finally {

            showLoading(false);

            button1.disabled = false;
            button2.disabled = false;
        }
    }


    // ----------------------------------------------------------
    // SONUCU GÖSTER
    // ----------------------------------------------------------

    function showResult(data) {

        document.getElementById("turkishResult").textContent =
            data.turkish || "";

        document.getElementById("portugueseResult").textContent =
            data.portuguese || "";

        document.getElementById("pronunciationResult").textContent =
            data.pronunciation || "";


        currentPortugueseSentence =
            data.portuguese || "";


        document.getElementById("result").style.display =
            "block";


        window.scrollTo({
            top: document.getElementById("result").offsetTop - 20,
            behavior: "smooth"
        });
    }


    // ----------------------------------------------------------
    // PORTUGİZCEYİ SESLENDİR
    // ----------------------------------------------------------

    function speakPortuguese() {

        if (!currentPortugueseSentence) {
            return;
        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                currentPortugueseSentence
            );


        /*
         * Avrupa Portekizcesi
         */
        utterance.lang = "pt-PT";

        utterance.rate = 0.85;
        utterance.pitch = 1;


        window.speechSynthesis.speak(
            utterance
        );
    }


    // ----------------------------------------------------------
    // YENİ CÜMLE
    // ----------------------------------------------------------

    function newSentence() {

        document.getElementById("result").style.display =
            "none";


        if (currentMode === "manual") {

            document.getElementById("turkishSentence").value =
                "";

            document.getElementById("turkishSentence").focus();

        } else {

            generateSentence();

        }
    }


    // ----------------------------------------------------------
    // LOADING
    // ----------------------------------------------------------

    function showLoading(show) {

        document.getElementById("loading").style.display =
            show ? "block" : "none";
    }


    // ----------------------------------------------------------
    // ERROR
    // ----------------------------------------------------------

    function showError(message) {

        const error =
            document.getElementById("error");

        error.textContent = message;
        error.style.display = "block";
    }


    function hideError() {

        document.getElementById("error").style.display =
            "none";
    }


    // ----------------------------------------------------------
    // ENTER / CTRL+ENTER
    // ----------------------------------------------------------

    document
        .getElementById("turkishSentence")
        .addEventListener("keydown", function(event) {

            if (
                event.key === "Enter" &&
                (event.ctrlKey || event.metaKey)
            ) {

                event.preventDefault();

                translateSentence();
            }

        });

</script>

</body>
</html>
